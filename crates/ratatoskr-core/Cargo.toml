[package]
name = "ratatoskr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CultMesh media receive core. Carries the transport so the OBS plugin does not have to."

[lib]
name = "ratatoskr_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "4160ab560b15150d8054c5c7f557711ad244b8e0", package = "cultnet-rs" }
