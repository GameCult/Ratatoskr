[package]
name = "ratatoskr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CultMesh media receive core. Carries the transport so the OBS plugin does not have to."

[lib]
name = "ratatoskr_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "c84cb2e", package = "cultnet-rs" }
cultmesh-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "c84cb2e", package = "cultmesh-rs" }
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "c84cb2e", package = "cultcache-rs" }

[dev-dependencies]
rmp-serde = "1.3"
