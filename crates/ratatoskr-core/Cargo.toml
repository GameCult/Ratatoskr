[package]
name = "ratatoskr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CultMesh media receive core. Carries the transport so the OBS plugin does not have to."

[lib]
name = "ratatoskr_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "96138ffcfa7d48fe00d31079d7859baa1f3c9a58", package = "cultnet-rs" }
